<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifique seu E-mail - Circularis</title>

    <script>
      // Se tiver token na URL, manda para a página de confirmação
      if (window.location.search.includes('token=')) {
        window.location.replace('confirmar-conta.html' + window.location.search);
      }
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
    
    <link rel="stylesheet" href="styles.css/verificacao-email.css" />
    <link rel="stylesheet" href="styles.css/global.css">
  </head>

  <body>
    <main class="container-fluid vh-100">
      <div class="row h-100">
        <div class="col-lg-6 col-md-12 left-section d-flex flex-column">
          <div class="logo-container">
            <a href="index.html" class="logo d-flex align-items-center">
              <img src="assets/logo.png" alt="Logo Circularis" class="logo-simples"/>
            </a>

            <div class="form-container">
              <h1 class="form-title">Verifique o seu E-mail</h1>
              
              <div class="email-icon-wrapper">
                <img src="assets/email-icon.png" alt="Ícone de e-mail" class="email-icon"/>
              </div>

              <p class="form-subtitle">
                Um e-mail foi enviado para <strong id="emailDisplay">sua conta</strong> com um link para verificar a sua conta.
              </p>

              <button class="btn-login-full" id="reenviarEmailBtn">Reenviar e-mail</button>

              <p class="cadastro-link mt-4 text-center">
                Precisa de ajuda? <a href="contato.html" class="link-green">Fale conosco</a>
              </p>
            </div>
          </div>
        </div>

        <div class="col-lg-6 d-none d-lg-flex right-section">
          <div class="welcome-container">
            <img src="assets/imgverify.png" alt="Ilustração" class="welcome-illustration"/>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/verificacao-script.js"></script>
  </body>
</html>
