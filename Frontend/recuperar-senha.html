<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - Circularis</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  
  <link rel="stylesheet" href="styles.css/recuperar-senha.css">
</head>
<body>
  
  <main class="card-box">
      
      <a href="index.html">
          <img src="assets/logo.png" alt="Logo Circularis" class="logo-img">
      </a>

      <h1 class="form-title">Recuperar Senha</h1>
      <p class="form-subtitle">Informe seu e-mail cadastrado e enviaremos um link para você redefinir a senha.</p>
      
      <form id="formRecuperacao" novalidate>
          <div class="form-group">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
              <div class="error-text" id="emailFeedback">Por favor, digite um e-mail válido.</div>
          </div>
          
          <button type="submit" class="btn-login-full" id="btnEnviar">Enviar Link</button>
      </form>

      <div class="back-link-container">
          <a href="login.html">
              <i class="bi bi-arrow-left"></i> Voltar para Login
          </a>
      </div>

  </main>

  <script src="scripts/utils.js"></script>
  <script type="module" src="scripts/recuperar-senha.js"></script>
</body>
</html>
