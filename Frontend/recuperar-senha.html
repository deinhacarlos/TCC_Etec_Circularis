<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - Circularis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  
  <link rel="stylesheet" href="styles.css/global.css"> <link rel="stylesheet" href="styles.css/login.css">
</head>
<body>
  <main class="container-fluid vh-100 main-content">
    <div class="row h-100 justify-content-center align-items-center">
      <div class="col-12 col-md-6 col-lg-4 d-flex flex-column align-items-center">
        <div class="logo-container mb-4">
            <a href="index.html" class="logo d-flex align-items-center text-decoration-none">
              <img src="assets/logo.png" alt="Logo Circularis" class="logo-simples">
            </a>
        </div>
        <div class="form-container" style="height: auto;"> 
            <h1 class="form-title">Recuperar Senha</h1>
            <p class="form-subtitle">Informe seu e-mail cadastrado para receber o link de redefinição.</p>
            <form id="formRecuperacao" novalidate>
              <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
              </div>
              <button type="submit" class="btn-login-full mt-3" id="btnEnviar">Enviar Link</button>
            </form>
            <p class="cadastro-link mt-4" style="margin-top: 1.5rem;">
              Lembrou a senha? <a href="login.html">Voltar para Login</a>
            </p>
        </div>
      </div>
    </div>
  </main>

  <script src="scripts/utils.js"></script> <script type="module">
    import { apiPostPublic } from './src/Api.js'; 

    const form = document.getElementById('formRecuperacao');
    const btn = document.getElementById('btnEnviar');
    const emailInput = document.getElementById('email');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();

      if(!email) {
         emailInput.classList.add('error');
         return;
      }

      btn.disabled = true;
      btn.textContent = "Enviando...";
      emailInput.classList.remove('error');

      try {
        const res = await apiPostPublic('/usuarios/esqueci-senha', { email });
        // USO DO TOAST GLOBAL
        showToast(res.message, 'success');
        form.reset();
      } catch (error) {
        showToast('Erro ao conectar com o servidor.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = "Enviar Link";
      }
    });
  </script>
</body>
</html>
