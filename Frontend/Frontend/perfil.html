<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Circularis</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="styles.css/global.css">
    <link rel="stylesheet" href="styles.css/perfil.css">
</head>
<body>
    <div class="perfil-layout">
        <aside class="perfil-sidebar">
            <div class="sidebar-header">
                <a href="busca.html" class="logo">
                    <img src="assets/logo.png" alt="Logo" class="logo-icon" onerror="this.src='https://via.placeholder.com/75'">
                    <span>CIRCULARIS</span>
                </a>
            </div>
            <nav class="sidebar-menu">
                <a href="perfil.html" class="menu-item active"><i class="bi bi-gear"></i><span>Dados Pessoais</span></a>
                <a href="meusmateriais.html" class="menu-item"><i class="bi bi-book"></i><span>Meus Livros/Materiais</span></a>
                <a href="trocas-pendentes.html" class="menu-item"><i class="bi bi-arrow-left-right"></i><span>Trocas Pendentes</span></a>
                <a href="notificacoes.html" class="menu-item"><i class="bi bi-bell"></i><span>Notificações</span><span id="sidebarCount" class="badge-count" style="display:none">0</span></a>
                <a href="configuracoes-conta.html" class="menu-item"><i class="bi bi-sliders"></i><span>Configurações de Conta</span></a>
            </nav>
            <button class="btn-sair" id="btnLogout"><i class="bi bi-box-arrow-left"></i><span>Logout</span></button>
            <button class="btn-voltar" onclick="window.location.href='busca.html'"><i class="bi bi-box-arrow-left"></i><span>Voltar</span></button>
        </aside>

        <main class="perfil-content">
            <section class="profile-section">
                <div class="profile-header">
                    <div class="profile-photo-container">
                        <img src="https://via.placeholder.com/150/6C63FF/FFFFFF?text=User" alt="Foto" class="profile-photo" id="profilePhoto">
                        <input type="file" id="photoInput" accept="image/*" style="display: none;">
                    </div>
                    <div class="profile-info">
                        <div class="profile-name-container">
                            <h2 class="profile-name" id="profileName">Carregando...</h2>
                        </div>
                        <p class="profile-email"><i class="bi bi-envelope"></i> <span id="profileEmailDisplay">...</span></p>
                        <p class="profile-location"><i class="bi bi-geo-alt"></i> <span id="profileLocationDisplay">...</span></p>
                    </div>
                </div> <div class="profile-actions">
                    <button class="btn-trocar-foto" id="btnTrocarFoto">Trocar Foto</button>
                    <button class="btn-editar-perfil" id="btnEditarPerfil">Editar Perfil</button>
                </div>
            </section>

            <section class="dados-section">
                <h3 class="section-title">Dados Pessoais</h3>
                
                <form id="formDados" novalidate> 
                    <div class="form-group">
                        <label for="nomeCompleto">Nome Completo</label>
                        <input type="text" class="form-control" id="nomeCompleto" required disabled>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" disabled>
                    </div>
                    <div class="form-group">
                        <label for="localizacao">Localização (Endereço)</label>
                        <input type="text" class="form-control" id="localizacao" disabled>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-salvar" id="btnSalvar" style="display: none;">Salvar Alterações</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/perfil-script.js"></script>
</body>
</html>
