<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifique seu E-mail - Circularis</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />

    <!-- CSS Externo (mesmo do login) -->
    <link rel="stylesheet" href="styles.css/verificacao-email.css" />
  </head>

  <body>
    <main class="container-fluid vh-100">
      <div class="row h-100">
        <!-- ==================== LADO ESQUERDO ==================== -->
        <div class="col-lg-6 col-md-12 left-section d-flex flex-column">
          <div class="logo-container">
            <a href="index.html" class="logo d-flex align-items-center">
              <img
                src="assets/logo.png"
                alt="Logo Circularis"
                class="logo-simples"
              />
            </a>

            <div class="form-container">
              <h1 class="form-title">Verifique o seu E-mail</h1>
              <!-- Ícone -->
              <div class="email-icon-wrapper">
                <img
                  src="assets/email-icon.png"
                  alt="Ícone de e-mail"
                  class="email-icon"
                />
              </div>

              <p class="form-subtitle">
                Um e-mail foi enviado para
                <strong>exemplo.email@gmail.com</strong> com um link para
                verificar a sua conta. Por favor, cheque sua caixa de Spam antes
                de clicar em “Reenviar”.
              </p>

              <!-- Botão reenviar -->
              <button class="btn-login-full" id="reenviarEmailBtn">
                Reenviar e-mail
              </button>

              <p class="cadastro-link mt-4 text-center">
                Precisa de ajuda?
                <a href="contato.html" class="link-green">Fale conosco</a>
              </p>
            </div>
          </div>
        </div>

        <!-- ==================== LADO DIREITO ==================== -->
        <div class="col-lg-6 d-none d-lg-flex right-section">
          <div class="welcome-container">
            <img
              src="assets/imgverify.png"
              alt="Ilustração verificação"
              class="welcome-illustration"
            />
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

     <link rel="stylesheet" href="styles.css/global.css">
    <script type="module" src="scripts/verify-email.js"></script>
  </body>
</html>
