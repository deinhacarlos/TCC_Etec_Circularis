<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nova Senha - Circularis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <link rel="stylesheet" href="styles.css/global.css"> <link rel="stylesheet" href="styles.css/login.css">
</head>
<body>
  <main class="container-fluid vh-100 main-content">
    <div class="row h-100 justify-content-center align-items-center">
      <div class="col-12 col-md-6 col-lg-4 d-flex flex-column align-items-center">
        <div class="logo-container mb-4">
            <a href="index.html" class="logo d-flex align-items-center text-decoration-none">
              <img src="assets/logo.png" alt="Logo Circularis" class="logo-simples">
            </a>
        </div>
        <div class="form-container" style="height: auto;">
            <h1 class="form-title">Nova Senha</h1>
            <p class="form-subtitle">Crie uma nova senha segura para sua conta.</p>
            <form id="formRedefinir">
              <div class="form-group">
                <label for="novaSenha">Nova Senha</label>
                <div class="password-container">
                  <input type="password" class="form-control" id="novaSenha" placeholder="••••••••" required minlength="6">
                  <button type="button" class="toggle-password" id="togglePassword">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <div class="error-message" id="senhaError"></div>
              </div>
              <button type="submit" class="btn-login-full mt-3" id="btnSalvar">Alterar Senha</button>
            </form>
        </div>
      </div>
    </div>
  </main>

  <script src="scripts/utils.js"></script> <script type="module">
    import { apiPostPublic } from './src/Api.js';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    
    const btn = document.getElementById('btnSalvar');
    const passwordInput = document.getElementById('novaSenha');
    const toggleBtn = document.getElementById('togglePassword');
    const formContainer = document.querySelector('.form-container');

    if (!token) {
        formContainer.innerHTML = `
            <div class="text-center">
                <h3 class="form-title text-danger">Link Inválido</h3>
                <p class="form-subtitle">Solicite uma nova recuperação de senha.</p>
                <a href="recuperar-senha.html" class="btn-login-full text-decoration-none d-block text-center text-white">Voltar</a>
            </div>
        `;
    }

    if(toggleBtn){
        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = toggleBtn.querySelector('i');
            icon.classList.toggle('bi-eye');
            icon.classList.toggle('bi-eye-slash');
        });
    }

    document.getElementById('formRedefinir')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const novaSenha = passwordInput.value;
      const erroDiv = document.getElementById('senhaError');

      if(novaSenha.length < 6) {
          passwordInput.classList.add('error');
          erroDiv.textContent = "A senha deve ter no mínimo 6 caracteres.";
          erroDiv.classList.add('show');
          return;
      } else {
          passwordInput.classList.remove('error');
          erroDiv.classList.remove('show');
      }

      btn.disabled = true;
      btn.textContent = "Salvando...";

      try {
        await apiPostPublic(`/usuarios/redefinir-senha/${token}`, { novaSenha });
        
        showToast('Senha alterada com sucesso!', 'success');
        
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 2000);

      } catch (error) {
        let texto = error.message || 'Erro desconhecido';
        if(texto.includes('expirado') || texto.includes('inválido')) texto = 'Link expirado. Solicite novamente.';
        
        showToast(texto, 'error');
        btn.disabled = false;
        btn.textContent = "Alterar Senha";
      }
    });
  </script>
</body>
</html>
