<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Materiais - Circularis</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="styles.css/global.css"> <link rel="stylesheet" href="styles.css/perfil.css"> 
    <link rel="stylesheet" href="styles.css/meusmateriais.css">
</head>

<body>
    <div class="perfil-layout">
        <aside class="perfil-sidebar">
            <div class="sidebar-header">
                <a href="busca.html" class="logo">
                    <img src="assets/logo.png" alt="Logo Circularis" class="logo-icon" onerror="this.src='https://via.placeholder.com/75'">
                    <span>CIRCULARIS</span>
                </a>
            </div>
            <nav class="sidebar-menu">
                <a href="perfil.html" class="menu-item">
                    <i class="bi bi-gear"></i>
                    <span>Dados Pessoais</span>
                </a>
                <a href="meusmateriais.html" class="menu-item active">
                    <i class="bi bi-book"></i>
                    <span>Meus Livros/Materiais</span>
                </a>
                <a href="trocas-pendentes.html" class="menu-item">
                    <i class="bi bi-arrow-left-right"></i>
                    <span>Minhas Trocas</span>
                </a>
                <a href="notificacoes.html" class="menu-item">
                    <i class="bi bi-bell"></i>
                    <span>Notificações</span>
                    <span id="sidebarCount" class="badge-count" style="display:none">0</span>
                </a>
                <a href="configuracoes-conta.html" class="menu-item">
                    <i class="bi bi-sliders"></i>
                    <span>Configurações de Conta</span>
                </a>
            </nav>
            <button class="btn-sair" id="btnLogout">
                <i class="bi bi-box-arrow-left"></i>
                <span>Logout</span>
            </button>
            <button class="btn-voltar" onclick="window.location.href='busca.html'">
                <i class="bi bi-box-arrow-left"></i>
                <span>Voltar</span>
            </button>
        </aside>

        <main class="perfil-content">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title mb-0">Gerenciar Materiais</h2>
                <a href="cadastrarmaterial.html" class="btn-novo-material">
                    <i class="bi bi-plus-lg"></i>
                    <span>Novo Material</span>
                </a>
            </div>

            <div id="alertArea"></div>

            <div class="materiais-section">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="text-center">Foto</th>
                                <th class="text-center">Título</th>
                                <th class="text-center">Descrição</th>
                                <th class="text-center">Tipo</th>
                                <th class="text-center">Conservação</th>
                                <th class="text-center">Categoria</th>
                                <th class="text-center">Autor</th>
                                <th class="text-center">Cadastro</th>
                                <th class="text-center">Objetivo</th>
                                <th class="text-center">Local</th>
                                <th class="text-center">Status</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="materiaisBody"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div> 
    
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="editarForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Editar Material</h5> 
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body"> 
                        <input type="hidden" id="editId">
                        <div class="row g-3">
                            <div class="col-md-6"> <label class="form-label small">Título</label> <input type="text" class="form-control" id="editTitulo" required> </div>
                            <div class="col-md-6"> <label class="form-label small">Autor</label> <input type="text" class="form-control" id="editAutor"> </div>
                            <div class="col-md-6"> <label class="form-label small">Tipo</label> <input type="text" class="form-control" id="editTipo" required> </div>
                            <div class="col-md-6"> <label class="form-label small">Categoria</label> <input type="text" class="form-control" id="editCategoria"> </div>
                            <div class="col-md-6"> 
                                <label class="form-label small">Conservação</label> 
                                <select class="form-select" id="editConservacao" required>
                                    <option value="">Selecione...</option>
                                    <option value="Novo">Novo</option>
                                    <option value="Bom">Bom</option>
                                    <option value="Regular">Regular</option>
                                    <option value="Ruim">Ruim</option>
                                </select> 
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Data Cadastro</label>
                                <input type="text" class="form-control" id="editDataCadastro" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Última Alteração</label>
                                <input type="text" class="form-control" id="editDataAlteracao" disabled>
                            </div>
                            <div class="col-md-6"> 
                                <label class="form-label small">Objetivo</label> 
                                <select class="form-select" id="editObj" required>
                                    <option value="troca">Troca</option>
                                    <option value="doacao">Doação</option>
                                </select> 
                            </div>
                            <div class="col-12"> <label class="form-label small">Descrição</label> <textarea class="form-control" id="editDescricao" rows="3"></textarea> </div>
                            <div class="col-md-6"> <label class="form-label small">Localização</label> <input type="text" class="form-control" id="editLocalizacao"> </div>
                            <div class="col-md-6 d-flex align-items-center">
                                <div class="form-check form-switch mt-4"> 
                                    <input class="form-check-input" type="checkbox" id="editDisponibilidade"> 
                                    <label class="form-check-label" for="editDisponibilidade"> Disponível para troca/doação </label> 
                                </div>
                            </div>
                            <div class="col-12"> 
                                <label class="form-label small">Imagem</label>
                                <div class="d-flex gap-3 align-items-center"> 
                                    <img src="" id="editImgPreview" style="height:60px;width:60px;border-radius:8px;object-fit:cover;display:none;">
                                    <input type="file" id="editFileInput" accept="image/*" class="form-control">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer"> 
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button> 
                        <button type="submit" class="btn btn-success" style="background-color: var(--success-green); border: none;"> Salvar Alterações </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/utils.js"></script> <script src="scripts/meusmateriais-script.js"></script>
</body>
</html>
