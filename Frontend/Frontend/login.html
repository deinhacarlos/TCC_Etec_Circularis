<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Circularis</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <!-- CSS Externo -->
  <link rel="stylesheet" href="styles.css/global.css"><link rel="stylesheet" href="styles.css/login.css">
</head>

<body>

  <!-- ==================== HEADER ==================== -->


  <main class="container-fluid  vh-100">
    <div class="row h-100">
      <div class="col-lg-6 col-md-12 left-section d-flex flex-column">
        <div class="logo-container">
          <a href="index.html" class="logo d-flex align-items-center">
            <img src="assets/logo.png" alt="Logo Circularis" class="logo-simples">
          </a>
          <!-- LADO ESQUERDO (FORMULÁRIO) -->
          <div class="form-container">
            <h1 class="form-title">Você voltou!</h1>
            <p class="form-subtitle">Bem-vindo de volta! Entre na sua conta.</p>

            <form id="loginForm" novalidate>

              <!-- E-mail -->
              <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                <div class="error-message" id="emailError"></div>
              </div>

              <!-- Senha -->
              <div class="form-group">
                <label for="password">Senha</label>
                <div class="password-container">
                  <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                  <button type="button" class="toggle-password" id="togglePassword">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <div class="error-message" id="passwordError"></div>
              </div>

              <!-- Link de Recuperar Senha -->
              <div class="forgot-password">
                <p>Esqueceu sua senha? <a href="recuperar-senha.html" class="link-blue">Recuperar agora</a></p>
              </div>

              <!-- Botão Login -->
              <button type="submit" class="btn-login-full">Login</button>
            </form>

            <!-- Link para Cadastro -->
            <p class="cadastro-link">
              Não tem uma conta ainda? <a href="cadastrousuario.html">Cadastre-se</a>
            </p>
          </div>
        </div>
      </div>
      <!-- LADO DIREITO (BOAS-VINDAS) -->
      <!-- LADO DIREITO (BOAS-VINDAS) -->
      <div class="col-lg-6 d-none d-lg-flex right-section">
        <div class="welcome-container">
          <h2 class="welcome-title">Ficamos felizes em ter você de volta!</h2>
          <p class="welcome-subtitle">Continue fazendo a diferença.</p>

          <img src="assets/cadastroLogin.png" alt="Pessoas comemorando" class="welcome-illustration">
        </div>
      </div>
    </div>

  </main>

  <!-- ==================== FOOTER ==================== -->
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript personalizado -->
  <script src="scripts/utils.js"></script>
  <script type="module" src="scripts/login-script.js?v=123"></script>


</body>

</html>
