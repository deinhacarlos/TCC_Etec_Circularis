<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações - Circularis</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css/global.css"> 
    <link rel="stylesheet" href="styles.css/perfil.css">  
    <link rel="stylesheet" href="styles.css/notificacoes.css"> 
</head>
<body>
    <div class="perfil-layout">
        <aside class="perfil-sidebar">
            <div class="sidebar-header">
                <a href="busca.html" class="logo">
                    <img src="assets/logo.png" alt="Logo" class="logo-icon" onerror="this.src='https://via.placeholder.com/75'">
                    <span>CIRCULARIS</span>
                </a>
            </div>
            <nav class="sidebar-menu">
                <a href="perfil.html" class="menu-item"><i class="bi bi-gear"></i><span>Dados Pessoais</span></a>
                <a href="meusmateriais.html" class="menu-item"><i class="bi bi-book"></i><span>Meus Livros/Materiais</span></a>
                <a href="trocas-pendentes.html" class="menu-item"><i class="bi bi-arrow-left-right"></i><span>Trocas Pendentes</span></a>
                <a href="notificacoes.html" class="menu-item active"><i class="bi bi-bell"></i><span>Notificações</span><span id="sidebarCount" class="badge-count" style="display:none">0</span></a>
                <a href="configuracoes-conta.html" class="menu-item"><i class="bi bi-sliders"></i><span>Configurações de Conta</span></a>
            </nav>
            <button class="btn-sair" id="btnLogout"><i class="bi bi-box-arrow-left"></i><span>Logout</span></button>
            <button class="btn-voltar" onclick="window.location.href='busca.html'"><i class="bi bi-box-arrow-left"></i><span>Voltar</span></button>
        </aside>

        <main class="perfil-content">
            <section class="notifications-container">
                <div class="notifications-header">
                    <div><h2>Minhas Notificações</h2><p>Fique por dentro das atualizações e alertas.</p></div>
                    <div><button class="btn-mark-all" onclick="marcarTodasLidas()"><i class="bi bi-check-all"></i> Marcar todas lidas</button></div>
                </div>
                
                <div class="filters-container">
                    <button class="btn-filter active" id="filterAll" onclick="filtrar('todas')">Todas</button>
                    <button class="btn-filter" id="filterUnread" onclick="filtrar('nao-lidas')">Não Lidas</button>
                    <button class="btn-filter" id="filterAlerts" onclick="filtrar('alertas')">Alertas</button>
                </div>
                
                <div id="notificationsList">
                    <div class="text-center mt-5"><div class="spinner-border text-primary" role="status"></div></div>
                </div>
                
                <div id="emptyStateTemplate" style="display: none;">
                    <div class="empty-state"><i class="bi bi-bell-slash"></i><h4>Tudo limpo!</h4><p>Nenhuma notificação encontrada.</p></div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/notificacoes-script.js"></script>
</body>
</html>
