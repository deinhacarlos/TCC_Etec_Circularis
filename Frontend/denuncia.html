<!-- MODAL DE DENÚNCIA (HTML) -->
<div class="modal fade" id="modalDenuncia" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title"><i class="bi bi-exclamation-triangle-fill me-2"></i>Denunciar / Alertar</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formDenuncia">
            <input type="hidden" id="denunciaMaterialId">
            
            <p class="text-muted small">
                Este alerta será enviado anonimamente para o proprietário do item. Use esta ferramenta para avisar sobre regras violadas ou informações incorretas.
            </p>

            <div class="mb-3">
                <label for="motivoDenuncia" class="form-label fw-bold">Qual o problema?</label>
                <select class="form-select" id="tipoDenuncia" required>
                    <option value="" selected disabled>Selecione um motivo...</option>
                    <option value="Conteúdo Impróprio">Conteúdo Impróprio / Ofensivo</option>
                    <option value="Informação Falsa">Informação Falsa / Enganosa</option>
                    <option value="Item Proibido">Item Proibido (Venda, Dinheiro, etc)</option>
                    <option value="Spam">Spam / Anúncio Repetido</option>
                    <option value="Outro">Outro Motivo</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="descricaoDenuncia" class="form-label fw-bold">Detalhes (Opcional)</label>
                <textarea class="form-control" id="descricaoDenuncia" rows="3" placeholder="Descreva brevemente o problema para ajudar o usuário a corrigir..."></textarea>
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" onclick="enviarDenuncia()">Enviar Alerta</button>
      </div>
    </div>
  </div>
</div>

<!-- SCRIPT ATUALIZADO (Copie para seu JS ou tag <script>) -->
<script>
    let modalDenunciaBS = null;

    // Função chamada ao clicar em "Denunciar" no card
    function reportBook(bookId) {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        // Abre o modal
        document.getElementById('denunciaMaterialId').value = bookId;
        document.getElementById('formDenuncia').reset();
        
        const modalEl = document.getElementById('modalDenuncia');
        modalDenunciaBS = new bootstrap.Modal(modalEl);
        modalDenunciaBS.show();
    }

    // Função que envia os dados para o backend
    async function enviarDenuncia() {
        const materialId = document.getElementById('denunciaMaterialId').value;
        const tipo = document.getElementById('tipoDenuncia').value;
        const descricao = document.getElementById('descricaoDenuncia').value;
        const userId = localStorage.getItem('usuarioId');
        const token = localStorage.getItem('token');

        if (!tipo) {
            alert("Por favor, selecione um motivo.");
            return;
        }

        // Combina o tipo com a descrição para ficar mais completo
        const textoFinal = descricao ? `${tipo}: ${descricao}` : tipo;

        const dados = {
            Descricao: textoFinal,
            Tipo_Denuncia: "Alerta",
            Id_Usuario_Denunciante_FK: userId,
            Id_Material_FK: materialId
        };

        const btnEnviar = document.querySelector('#modalDenuncia .btn-danger');
        const textoOriginal = btnEnviar.textContent;
        btnEnviar.disabled = true;
        btnEnviar.textContent = "Enviando...";

        try {
            const response = await fetch('http://localhost:3000/api/denuncias', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(dados)
            });

            if (response.ok) {
                alert("O proprietário foi alertado com sucesso.");
                modalDenunciaBS.hide();
            } else {
                const erro = await response.json();
                alert("Erro: " + (erro.message || "Não foi possível enviar."));
            }
        } catch (error) {
            console.error(error);
            alert("Erro de conexão.");
        } finally {
            btnEnviar.disabled = false;
            btnEnviar.textContent = textoOriginal;
        }
    }
</script>
