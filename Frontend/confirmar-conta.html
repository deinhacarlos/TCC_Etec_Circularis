<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmando Conta - Circularis</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="styles.css/confirmar-conta.css">
    <link rel="stylesheet" href="styles.css/global.css">
</head>
<body>

    <div class="confirm-container">
        <div class="card-confirmacao">
            
            <div id="loadingState">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <h3 class="status-title">Validando sua conta...</h3>
                <p class="status-text">Aguarde enquanto confirmamos seus dados.</p>
            </div>

            <div id="successState" style="display: none;">
                <i class="bi bi-check-circle-fill icon-success mb-3"></i>
                <h3 class="status-title text-success">Conta Ativada!</h3>
                <p class="status-text">Seu e-mail foi confirmado com sucesso. Agora você pode acessar a plataforma.</p>
                <a href="login.html" class="btn-action btn-success-custom">Ir para o Login</a>
            </div>

            <div id="errorState" style="display: none;">
                <i class="bi bi-x-circle-fill icon-error mb-3"></i>
                <h3 class="status-title text-danger">Falha na Validação</h3>
                <p class="status-text" id="errorMsg">O link é inválido ou expirou.</p>
                <a href="cadastrousuario.html" class="btn-action btn-outline-custom">Voltar ao Cadastro</a>
            </div>

        </div>
        
        <p class="footer-text mt-4">Circularis © 2025</p>
    </div>

    <script src="scripts/confirmar-conta-script.js"></script>
</body>
</html>
