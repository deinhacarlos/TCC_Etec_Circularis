<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmando Conta - Circularis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-confirmacao {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .icon-status { font-size: 4rem; margin-bottom: 1.5rem; display: block; }
        h2 { color: #333; font-weight: 700; margin-bottom: 1rem; }
        p { color: #666; margin-bottom: 2rem; }
        .btn-action { padding: 12px 30px; border-radius: 50px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card-confirmacao">
        <div id="loadingState">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
            <h3 class="mt-3">Validando...</h3>
        </div>

        <div id="successState" style="display: none;">
            <i class="bi bi-check-circle-fill text-success icon-status"></i>
            <h2>Conta Ativada!</h2>
            <p>Seu e-mail foi confirmado com sucesso. Agora você pode acessar sua conta.</p>
            <a href="login.html" class="btn btn-success btn-action">Ir para Login</a>
        </div>

        <div id="errorState" style="display: none;">
            <i class="bi bi-x-circle-fill text-danger icon-status"></i>
            <h2>Link Inválido</h2>
            <p id="errorMsg">Não foi possível confirmar sua conta. O link pode ter expirado.</p>
            <a href="cadastrousuario.html" class="btn btn-outline-secondary btn-action">Voltar</a>
        </div>
    </div>

    <script src="scripts/confirmar-conta-script.js"></script>
</body>
</html>
