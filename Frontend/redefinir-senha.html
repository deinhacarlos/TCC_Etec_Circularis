<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nova Senha - Circularis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <link rel="stylesheet" href="styles.css/recuperar-senha.css">
</head>
<body>
  
  <main class="card-box" id="containerPrincipal">
      
      <a href="index.html">
          <img src="assets/logo.png" alt="Logo Circularis" class="logo-img">
      </a>

      <h1 class="form-title">Nova Senha</h1>
      <p class="form-subtitle">Crie uma nova senha segura para sua conta.</p>
      
      <form id="formRedefinir" novalidate>
          <div class="form-group">
              <label for="novaSenha" class="form-label">Nova Senha</label>
              <div class="position-relative">
                  <input type="password" class="form-control" id="novaSenha" placeholder="Mínimo 8 caracteres" required>
                  <button type="button" class="btn border-0 position-absolute top-50 end-0 translate-middle-y" id="togglePassword" style="background: transparent; padding-right: 12px;">
                      <i class="bi bi-eye text-secondary"></i>
                  </button>
              </div>
          </div>

          <button type="submit" class="btn-login-full" id="btnSalvar">Alterar Senha</button>
      </form>

      <div class="back-link-container">
          <a href="login.html">Cancelar</a>
      </div>

  </main>

  <script src="scripts/utils.js"></script>
  <script type="module" src="scripts/redefinir-senha.js"></script>
</body>
</html>
