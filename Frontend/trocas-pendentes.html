<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trocas - Circularis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />

    <link rel="stylesheet" href="styles.css/global.css"> <link rel="stylesheet" href="styles.css/perfil.css?v=1" />
    <link rel="stylesheet" href="styles.css/trocas.css?v=1" />
</head>

<body>
    <div class="perfil-layout">

        <aside class="perfil-sidebar">
            <div class="sidebar-header">
                <a href="busca.html" class="logo">
                    <img src="assets/logo.png" alt="Logo Circularis" class="logo-icon" onerror="this.src='https://via.placeholder.com/75'">
                    <span>CIRCULARIS</span>
                </a>
            </div>

            <nav class="sidebar-menu">
                <a href="perfil.html" class="menu-item">
                    <i class="bi bi-gear"></i>
                    <span>Dados Pessoais</span>
                </a>
                <a href="meusmateriais.html" class="menu-item">
                    <i class="bi bi-book"></i>
                    <span>Meus Livros/Materiais</span>
                </a>
                <a href="trocas-pendentes.html" class="menu-item active">
                    <i class="bi bi-arrow-left-right"></i>
                    <span style="font-weight: 600;">Minhas Trocas</span>
                </a>
                <a href="notificacoes.html" class="menu-item">
                    <i class="bi bi-bell"></i>
                    <span>Notificações</span>
                    <span id="sidebarCount" class="badge-count" style="display:none">0</span>
                </a>
                <a href="configuracoes-conta.html" class="menu-item">
                    <i class="bi bi-sliders"></i>
                    <span>Configurações de Conta</span>
                </a>
            </nav>

            <button class="btn-sair" id="btnLogout">
                <i class="bi bi-box-arrow-left"></i>
                <span>Logout</span>
            </button>

            <button class="btn-voltar" onclick="window.location.href='busca.html'">
                <i class="bi bi-box-arrow-left"></i>
                <span>Voltar</span>
            </button>
        </aside>

        <main class="perfil-content">
            <h2 class="page-title mb-4">Gerenciar Trocas</h2>

            <ul class="nav nav-tabs mb-4" id="trocasTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="recebidas-tab" data-bs-toggle="tab" data-bs-target="#recebidas"
                        type="button" role="tab" aria-controls="recebidas" aria-selected="true">
                        <i class="bi bi-inbox-fill me-2"></i>Solicitações Recebidas
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="enviadas-tab" data-bs-toggle="tab" data-bs-target="#enviadas"
                        type="button" role="tab" aria-controls="enviadas" aria-selected="false">
                        <i class="bi bi-send-fill me-2"></i>Minhas Solicitações
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="trocasTabContent">
                <div class="tab-pane fade show active" id="recebidas" role="tabpanel" aria-labelledby="recebidas-tab">
                    <div id="listaRecebidas" class="mt-3">
                        <div class="text-center py-5">
                            <div class="spinner-border" role="status"></div>
                            <p class="mt-2 text-muted">Carregando solicitações...</p>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="enviadas" role="tabpanel" aria-labelledby="enviadas-tab">
                    <div id="listaEnviadas" class="mt-3">
                        <div class="text-center py-5">
                            <div class="spinner-border" role="status"></div>
                            <p class="mt-2 text-muted">Carregando seus pedidos...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="scripts/utils.js"></script>
    <script src="scripts/trocas-script.js?v=1"></script>
</body>
</html>
